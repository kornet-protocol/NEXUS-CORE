[package]
name = "nexus-core-engine"
version = "0.1.2"
edition = "2021"
authors = ["NEXUS-CORE Contributors"]
description = "NEXUS KORNET Core Engine - Rust components"

[lib]
path = "src/resource_balancer.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
