[platformio]
default_envs = esp32_mesh_node

[env:esp32_mesh_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    sparkfun/SparkFun ATECCX08a Arduino Library @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -D LORA_FREQUENCY=868E6
    -D SECURE_CHIP_I2C_ADDR=0x60
