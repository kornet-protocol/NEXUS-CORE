[package]
name = "nexus-zkp"
version = "0.1.2"
edition = "2021"
authors = ["NEXUS-CORE Contributors"]
description = "NEXUS ZK Proof Verifier"

[lib]
path = "src/zkp_action_verifier.rs"

[dependencies]
# Using arkworks ecosystem instead of deprecated bellman
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
