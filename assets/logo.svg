<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- NEXUS-CORE Logo: Cybernetic Negentropy -->
  <!-- Design: VSM-inspired viable system + Solarpunk emergence -->
  <!-- Single-color, high-contrast, PCB silkscreen safe -->
  
  <defs>
    <!-- Negentropic gradient pattern (for screen use only, ignored in silkscreen) -->
    <pattern id="negentropy" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="4" cy="4" r="1.5" fill="currentColor" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Outer boundary: Viable System boundary (System 5 - Policy/Identity) -->
  <circle cx="64" cy="64" r="60" stroke-width="1.5"/>
  
  <!-- System 3* (Audit) - Inner monitoring ring -->
  <circle cx="64" cy="64" r="44" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- System 2 (Coordination) - Three-phase oscillator channels -->
  <g stroke-width="1.5">
    <path d="M64 28 V44"/>
    <path d="M64 84 V100"/>
    <path d="M28 64 H44"/>
    <path d="M84 64 H100"/>
  </g>
  
  <!-- System 1 (Operations) - Three primary operational units (Bio/Energy/Info) -->
  <g stroke-width="1.5" opacity="0.8">
    <!-- Unit 1: Biosphere (upper) -->
    <path d="M64 44 L44 56 L64 68 L84 56 Z"/>
    <!-- Unit 2: Technosphere (lower right) -->
    <path d="M64 68 L84 80 L100 64 L84 48 Z"/>
    <!-- Unit 3: Sociosphere (lower left) -->
    <path d="M64 68 L44 80 L28 64 L44 48 Z"/>
  </g>
  
  <!-- Core: System 4 (Intelligence/Development) - The organizing principle -->
  <circle cx="64" cy="64" r="16" stroke-width="2"/>
  
  <!-- Negentropic seed: Central differentiator (System 5 - Identity) -->
  <circle cx="64" cy="64" r="6" fill="currentColor"/>
  
  <!-- Emergence arrows: Negentropy vector (order from chaos) -->
  <g stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M64 58 L64 50"/>
    <path d="M64 54 L58 58"/>
    <path d="M64 54 L70 58"/>
  </g>
  
  <!-- Feedback loops: Cybernetic circular causality (VSM) -->
  <g stroke-width="1" stroke-dasharray="2 3" opacity="0.5">
    <path d="M64 44 Q50 50 44 64 Q50 78 64 84 Q78 78 84 64 Q78 50 64 44"/>
  </g>
  
  <!-- Solar/wind energy harvesters (Solarpunk accent) - minimal markers -->
  <g stroke-width="1" opacity="0.4">
    <!-- Sun markers at cardinal points -->
    <g transform="translate(64, 4)">
      <circle r="2"/>
      <g stroke-width="0.5">
        <path d="M0 -10 L0 -14"/>
        <path d="M0 10 L0 14"/>
        <path d="M-10 0 L-14 0"/>
        <path d="M10 0 L14 0"/>
      </g>
    </g>
    <g transform="translate(64, 124)">
      <circle r="2"/>
      <g stroke-width="0.5">
        <path d="M0 -10 L0 -14"/>
        <path d="M0 10 L0 14"/>
        <path d="M-10 0 L-14 0"/>
        <path d="M10 0 L14 0"/>
      </g>
    </g>
    <g transform="translate(4, 64)">
      <circle r="2"/>
      <g stroke-width="0.5">
        <path d="M0 -10 L0 -14"/>
        <path d="M0 10 L0 14"/>
        <path d="M-10 0 L-14 0"/>
        <path d="M10 0 L14 0"/>
      </g>
    </g>
    <g transform="translate(124, 64)">
      <circle r="2"/>
      <g stroke-width="0.5">
        <path d="M0 -10 L0 -14"/>
        <path d="M0 10 L0 14"/>
        <path d="M-10 0 L-14 0"/>
        <path d="M10 0 L14 0"/>
      </g>
    </g>
  </g>
</svg>